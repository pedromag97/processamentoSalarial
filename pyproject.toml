[project]
name = "lsc-presencas"
version = "0.1.0"
description = "Presenças e pré-processamento salarial do Groupe LSC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "openpyxl>=3.1.5",
    "pyside6>=6.12.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "sqlalchemy>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lsc_presencas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["src/lsc_presencas/migracoes/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
